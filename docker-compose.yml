services:
  api:
    build:
      context: .
    container_name: veterinaria-x-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
      LIBELULA_BASE_URL: ${LIBELULA_BASE_URL}
      LIBELULA_APPKEY: ${LIBELULA_APPKEY}
      LIBELULA_CALLBACK_URL: ${LIBELULA_CALLBACK_URL}
      LIBELULA_MONEDA: ${LIBELULA_MONEDA:-BOB}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
